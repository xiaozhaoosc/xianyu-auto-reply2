# Docker Compose 配置文件
# 闲鱼自动回复系统 - 复用已有 MySQL/Redis
# 用法: docker compose -f docker-compose.yml up -d --build
# ⚠️ 密码等敏感配置从 .env 文件读取

services:
  # ====== 应用服务（复用已有 dev-mysql / dev-redis）======

  # Backend-Web 服务
  backend-web:
    build:
      context: .
      dockerfile: backend-web/Dockerfile
    container_name: xianyu-backend-web
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - MYSQL_HOST=${MYSQL_HOST:-dev-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-xianyu}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-xianyu_data}
      - REDIS_HOST=${REDIS_HOST:-dev-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0
      - BACKEND_WEB_PORT=${BACKEND_WEB_PORT:-8089}
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - REFRESH_TOKEN_EXPIRE_MINUTES=${REFRESH_TOKEN_EXPIRE_MINUTES:-10080}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - WEBSOCKET_SERVICE_URL=http://websocket:8090
      - SCHEDULER_SERVICE_URL=http://scheduler:8091
      - STATIC_DIR=/app/static
      - BACKUP_DIR=/app/backups
      - BROWSER_HEADLESS=${BROWSER_HEADLESS:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SQL_ECHO=${SQL_ECHO:-true}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - backend_web_logs:/app/backend-web/logs
      - static-files:/app/static
      - backup-files:/app/backups
    ports:
      - "8089:8089"
    networks:
      - xianyu-network
      - dev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # WebSocket 服务
  websocket:
    build:
      context: .
      dockerfile: websocket/Dockerfile
    container_name: xianyu-websocket
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - MYSQL_HOST=${MYSQL_HOST:-dev-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-xianyu}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-xianyu_data}
      - REDIS_HOST=${REDIS_HOST:-dev-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0
      - WEBSOCKET_PORT=${WEBSOCKET_PORT:-8090}
      - MAX_CAPTCHA_CONCURRENT=3
      - BROWSER_HEADLESS=${BROWSER_HEADLESS:-true}
      - BACKEND_WEB_SERVICE_URL=http://backend-web:8089
      - STATIC_DIR=/app/static
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SQL_ECHO=${SQL_ECHO:-true}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - websocket_logs:/app/websocket/logs
      - static-files:/app/static
      - browser_data:/app/browser_data
    ports:
      - "8090:8090"
    networks:
      - xianyu-network
      - dev-network
    depends_on:
      backend-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Scheduler 服务
  scheduler:
    build:
      context: .
      dockerfile: scheduler/Dockerfile
    container_name: xianyu-scheduler
    restart: unless-stopped
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - MYSQL_HOST=${MYSQL_HOST:-dev-mysql}
      - MYSQL_PORT=${MYSQL_PORT:-3306}
      - MYSQL_USER=${MYSQL_USER:-xianyu}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-xianyu_data}
      - REDIS_HOST=${REDIS_HOST:-dev-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=0
      - SCHEDULER_PORT=${SCHEDULER_PORT:-8091}
      - REDELIVERY_INTERVAL=5
      - RATE_INTERVAL=20
      - WEBSOCKET_SERVICE_URL=http://websocket:8090
      - BACKEND_WEB_SERVICE_URL=http://backend-web:8089
      - STATIC_DIR=/app/static
      - BACKUP_DIR=/app/backups
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SQL_ECHO=${SQL_ECHO:-true}
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - scheduler_logs:/app/scheduler/logs
      - static-files:/app/static:ro
      - backup-files:/app/backups
    ports:
      - "8091:8091"
    networks:
      - xianyu-network
      - dev-network
    depends_on:
      websocket:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # 前端服务
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    container_name: xianyu-frontend
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    ports:
      - "9002:80"
    networks:
      - xianyu-network
    depends_on:
      backend-web:
        condition: service_healthy

networks:
  xianyu-network:
    driver: bridge
  dev-network:
    external: true
    name: docker-compose_dev_network

volumes:
  websocket_logs:
    driver: local
  backend_web_logs:
    driver: local
  scheduler_logs:
    driver: local
  static-files:
    driver: local
  backup-files:
    driver: local
  browser_data:
    driver: local
